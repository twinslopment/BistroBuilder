/* V3: reference-derived flat pictograms, with the same visual weight as the
   example supplied for Rol, Salario, Asignación and Estado. */
.ic.pictogram{display:inline-block;object-fit:contain;filter:drop-shadow(0 1px 0 #fff6);vertical-align:middle}
.fact>.pictogram{width:20px;height:20px;justify-self:center}
.summary-section .pictogram{width:22px;height:22px}
.btn .pictogram{width:16px;height:16px}
.btn.danger .pictogram{filter:brightness(0) invert(1)}
/* Finer balance, closer to reference plate */

.header h1,.section-title,.profile-title h2,.skills-title{font-family:var(--display)}
.fact{grid-template-columns:24px minmax(72px,1fr) minmax(0,1.2fr)}

   typographic glyph icons and no embedded font files. */

function inspector(p,isCandidate){if(!p)return `<div class="empty-note">No hay personas que mostrar en esta categoría.</div>`;const statusText=isCandidate?'Candidato':!p.available?'Inactivo':working&&shift().has(p.id)?'Trabajando':'Activo';let skills=['Atención al cliente','Velocidad de servicio','Carisma','Trabajo en equipo'];return `<div class="inspector"><div class="inspector-top"><div class="portrait-frame"><img class="portrait-large" src="${img(p)}" alt="Retrato de ${p.name}"></div><div class="inspector-brief"><div class="profile-title"><div><h2>${p.name}</h2><div class="profile-role">${p.role}</div></div><button class="icon-button" id="editProfile" title="Consultar ficha">${icon('pencil','md')}</button></div><div class="xp-row"><div class="level-pill">${icon('star','sm')} Nivel ${p.level}</div><div class="bar" aria-label="Experiencia"><span style="width:${Math.min(100,Math.round(100*p.experience/p.next))}%"></span></div><small>${p.experience} / ${p.next} EXP.</small></div><div class="facts"><div class="fact">${icon('briefcase')}<span>Rol</span><span class="fact-value">${p.role}</span></div><div class="fact">${icon('coins')}<span>${isCandidate?'Salario esperado':'Salario'}</span><span class="fact-value">${shortCurrency(p.salary)} / mes</span></div><div class="fact">${icon('pin')}<span>Asignación</span><span class="fact-value">${p.department}</span></div><div class="fact">${icon('heart')}<span>Estado</span><span class="fact-value ${!isCandidate&&p.available?'available':''}">${statusText}</span></div></div></div></div><div class="skills-panel"><div class="skills-title">${icon('chart','md')} HABILIDADES</div><div class="skills-grid">${skills.map((label,i)=>`<div class="skill-line"><span>${label}</span><div class="bar"><span style="width:${p.skills[i]}%"></span></div><strong>${p.skills[i]}</strong></div>`).join('')}</div><div class="history">${isCandidate?'Habilidades iniciales de la candidatura':'Sin historial de rendimiento todavía'}</div></div><div class="actions">${isCandidate?`<button class="btn secondary" id="backPlantilla">${icon('forward')} Volver</button><button class="btn" id="candidateHire">${icon('check')} Contratar</button><button class="btn" id="renewMarket">${icon('candidate')} Mercado</button><button class="btn secondary" id="candidateSchedule">${icon('calendar')} Horarios</button>`:`<button class="btn secondary" id="availability">${icon('heart')} ${p.available?'No disponible':'Disponible'}</button><button class="btn" id="training">${icon('training')} Formación</button><button class="btn" id="toSchedule">${icon('calendar')} Ver horarios</button><button class="btn danger" id="dismiss">${icon('trash')} Despedir</button>`}</div></div>`}

let valid=waiters.length>=1&&cooks.length>=1;document.getElementById('detailPane').innerHTML=`<div class="schedule-detail"><h2>${icon('calendar','lg')} Horarios</h2><div class="detail-strap">Día ${day} · ${meal} · Previsión del personal</div><div class="metric-row"><div class="metric"><strong>${waiters.length}</strong><span>${icon('fork','sm')} Camareros</span></div><div class="metric"><strong>${cooks.length}</strong><span>${icon('chef','sm')} Cocina</span></div></div><div class="summary-section"><h3>${icon('coins','md')} Resumen del turno</h3><div class="summary-line"><span>Personal programado</span><b>${scheduled.length} empleados</b></div><div class="summary-line"><span>Coste salarial previsto</span><b>${currency(total)}</b></div><div class="summary-line"><span>Sala / Cocina</span><b>${waiters.length} / ${cooks.length}</b></div><div class="summary-line"><span>Servicio</span><b>${meal} · Día ${day}</b></div></div><div class="validation-note ${valid?'':'warn'}">${icon(valid?'check':'information','sm')} ${valid?'Hay al menos un camarero y un cocinero programados para este servicio.':'Falta cobertura en Sala o Cocina. Revisa los turnos antes de comenzar un servicio.'}</div><div class="schedule-actions"><button class="btn" id="minimum">${icon('team')} Cobertura mínima</button><button class="btn secondary" id="copyDay">${icon('copy')} Copiar al día siguiente</button><button class="btn secondary" id="backPersonal">${icon('forward')} Plantilla</button><button class="btn secondary" id="scheduleInfo">${icon('information')} Cómo funciona</button></div></div>`;

<script id="bb-v8-clean-serif-script">
/* Explicit text-run fallback is necessary because the bundled Recoleta
   is a DEMO OTF: accents and euro are rendered as demo marks despite cmap.
   Use Recoleta only for its clean 7-bit glyphs; Inter for other characters.
   On Unity, the equivalent behavior is handled by TMP's static-glyph fallback. */
(() => {
  const zones = [
    '.section .table-head > span',
    '.section .staff-row > span',
    '.section .table-btn',
    '.inspector .profile-title .profile-role',
    '.inspector .level-pill',
    '.inspector .fact > span',
    '.inspector .skills-grid .skill-line > span',
    '.inspector .skills-grid .skill-line > strong',
    '.inspector .actions .btn'
  ].join(',');
  let count = 0;
  function typeset(root) {
    if (!root) return;
    for (const element of root.querySelectorAll(zones)) {
      const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
      const pending = [];
      while (walk.nextNode()) {
        const node = walk.currentNode;
        if (!node.nodeValue.trim() || node.parentElement?.closest('[data-bb-v8-run]')) continue;
        pending.push(node);
      }
      for (const node of pending) {
        const parts = node.nodeValue.match(/[\x20-\x7e]+|[^\x20-\x7e]+/g);
        if (!parts) continue;
        // One wrapper keeps mixed ASCII/accent runs in ONE flex item:
        // no artificial gap in names like "Iván" or words like "Formación".
        const fragment = document.createDocumentFragment();
        const wordGroup = document.createElement('span');
        wordGroup.dataset.bbV8RunGroup = '1';
        for (const part of parts) {
          const ascii = /^[\x20-\x7e]+$/.test(part);
          const span = document.createElement('span');
          span.dataset.bbV8Run = ascii ? 'recoleta' : 'inter';
          span.style.setProperty('font-family',
             ascii ? '"BB V8 Clean Recoleta",serif' : '"BB Official Inter",sans-serif',
             'important');
          span.style.whiteSpace = 'pre';
          span.textContent = part;
          wordGroup.appendChild(span);
          count++;
        }
        fragment.appendChild(wordGroup);
        node.parentNode.replaceChild(fragment, node);
      }
    }
    document.documentElement.dataset.v8GlyphRuns = String(count);
  }
  function start() {
    typeset(document);
    const observer = new MutationObserver(() => typeset(document));
    observer.observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
  else start();
})();
</script>
