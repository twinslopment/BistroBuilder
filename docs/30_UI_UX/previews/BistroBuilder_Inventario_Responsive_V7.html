<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bistro Builder · Inventario · Tipografía ajustada · V7 Responsive</title>
<style>:root{
 --top:clamp(52px,4.1vw,82px);--bottom:clamp(58px,4.46vw,92px);
 --side:clamp(242px,17.6vw,336px);
 --graphite:#2c2924;--ink:#302923;--cream:#f3e5ca;--cream2:#e9d7b7;
 --gold:#d6a55e;--gold2:#a9773c;--line:#a6875c;
 --title:Recoleta,Georgia,serif;--body:Inter,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#161411;color:#f4e7cd;font-family:var(--body);min-width:980px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.48}
button:focus-visible,input:focus-visible,select:focus-visible,.table-row:focus-visible{outline:2px solid #e6bd78;outline-offset:2px}
.hud{position:absolute;left:0;width:100%;z-index:40;background:#171716}
.hud img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.hud.top{top:0;height:var(--top);border-bottom:1px solid #6f5b3b}
.hud.bottom{bottom:0;height:var(--bottom);border-top:1px solid #786343}
.hud-hotspot{position:absolute;top:0;bottom:0;background:transparent;border:0;opacity:0}
.hud-hotspot:focus-visible{opacity:1;outline:2px solid #e2b46a;outline-offset:-3px;background:rgba(195,139,65,.1)}
.hud-hotspot.inventory{left:38.2%;width:8.1%}
.app{position:absolute;inset:var(--top) 0 var(--bottom);display:grid;grid-template-columns:var(--side) minmax(0,1fr);background:#2d2a24;overflow:hidden}
.sidebar{position:relative;display:flex;flex-direction:column;min-height:0;background:linear-gradient(110deg,#302a23 0%,#2c2923 57%,#262520 100%);border-right:1px solid #8a704a5b;overflow:hidden}
.sidebar:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 4% 92%,rgba(185,137,71,.17),transparent 36%);pointer-events:none}
.sidebar-title{position:relative;z-index:2;color:#fff0cd;font-family:'Segoe Script','Brush Script MT','UnPilgi',cursive;font-size:clamp(46px,3.8vw,74px);font-style:italic;font-weight:700;line-height:1.05;letter-spacing:-.08em;text-shadow:0 1px 1px #5f3b1c,0 0 14px #dbb77b18;text-align:center;padding:24px 5px 28px;margin:0;white-space:nowrap}
.sidebar-links{position:relative;z-index:2;display:grid;gap:0;padding:5px 9px 0 19px}
.side-link{display:flex;align-items:center;gap:16px;position:relative;min-height:61px;width:100%;border:1px solid transparent;padding:0 15px;text-align:left;color:#f2e5cd;background:transparent;font-size:17px;font-weight:730;border-radius:7px;text-shadow:0 1px #0008;white-space:nowrap}
.side-link:hover:not(.active){background:linear-gradient(90deg,#b2864424,transparent);color:#fff0d1}
.side-link.active{min-height:51px;margin-bottom:9px;border:1px solid #cea15f;background:linear-gradient(180deg,#b98c4f 0%,#8d6333 59%,#80562f 100%);box-shadow:inset 0 1px #ffe1a07d,inset 0 0 10px #f5bf6a29,0 0 9px #dca65a30;color:#fff8e7}
.side-link:not(.active):after{content:'';position:absolute;left:4px;right:2px;bottom:0;height:1px;background:linear-gradient(90deg,#8d78583b,#6b594230,transparent)}
.side-link svg{width:24px;height:24px;flex:none;stroke:#e9d5ae;stroke-width:1.8}
.side-link.active svg{stroke:#fff3db}
.side-link .count{margin-left:auto;border:1px solid #b68c67;border-radius:999px;padding:3px 7px;font-size:11px;background:#925d43;color:#fff2d8}
.sidebar-decor{position:absolute;left:0;bottom:0;width:100%;height:min(56%,388px);object-fit:fill;pointer-events:none;z-index:1;opacity:.94}
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:linear-gradient(92deg,#36302a 0%,#2b2925 35%,#292723 100%);padding:23px 28px 14px 21px;overflow:hidden}
.main-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;min-height:43px}
.heading-text{min-width:0}
.heading-text h1{font:750 clamp(23px,1.7vw,32px)/1.15 var(--body);letter-spacing:-.055em;color:#fbf2e4;margin:1px 0 5px}
.heading-text p{margin:0;color:#bcae9b;font-size:11px;display:none}
.action-bar{display:flex;align-items:center;gap:8px;flex:none;padding-top:5px}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,#fce9b0,#e4bf78 58%,#c99249);color:#3a2916;border:1px solid #e8c88c;border-radius:7px;padding:7px 15px;min-height:35px;box-shadow:inset 0 1px #fff7d5,0 2px 8px #08070749;font-size:12px;font-weight:720;white-space:nowrap}
.btn-gold:hover{filter:brightness(1.075)}
.btn-gold:active{filter:brightness(.94)}
.btn-minor{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #8c775e;background:linear-gradient(#53493b,#352e27);color:#f4e2c7;border-radius:7px;padding:7px 12px;min-height:34px;font-size:12px;font-weight:650}
.btn-minor:hover{background:#66513a}
.btn-icon{width:33px;height:33px;padding:5px;background:transparent;border:1px solid #8e754e;border-radius:7px;color:#d6b682;display:grid;place-items:center}
.btn-icon:hover{background:#56432d}
.toolrow{display:flex;align-items:center;gap:10px;min-height:57px;justify-content:space-between;flex-wrap:nowrap}
.pills{display:flex;align-items:center;gap:6px;min-width:0;overflow:auto;scrollbar-width:none}
.pill{border:1px solid #6f655b;background:linear-gradient(180deg,#655b4f,#35302b);color:#faf1e2;border-radius:999px;min-width:113px;height:36px;padding:0 15px;white-space:nowrap;font-size:13px;font-weight:650;box-shadow:inset 0 1px #ffffff14,0 2px 5px #0004}
.pill.selected{background:linear-gradient(180deg,#f8dfa3,#e2b76a);border-color:#f1d48e;color:#3a2918;box-shadow:inset 0 1px #fff4cb,0 2px 5px #0004}
.pill:hover:not(.selected){background:linear-gradient(#766b59,#494036)}
.searchbar{display:flex;align-items:center;gap:8px;width:min(26%,260px);height:32px;margin-left:auto;border-bottom:1px solid #9e8965;color:#ddcbac}
.searchbar svg{width:15px;height:15px;flex:none}
.searchbar input{width:100%;min-width:0;border:0;outline:0;background:none;color:#f7ecdf;font-size:12px}
.searchbar input::placeholder{color:#dac8af}
.select-order{min-width:112px;max-width:130px;border:1px solid #6f5f49;border-radius:6px;background:#3b352d;color:#f1dcc0;padding:7px 8px;font-size:11px}
.table-frame{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden;border:1px solid #a38c6c;border-radius:10px;background:#f0e4d1;box-shadow:0 0 0 1px #f0cf9a16}
.table-head{display:grid;align-items:center;min-height:37px;padding:0 15px;background:linear-gradient(180deg,#6a6258,#38342e);color:#fff3e4;border-bottom:2px solid #af7f4a;font-size:12px;gap:12px}
.table-rows{min-height:0;overflow-y:auto;flex:1;background:#f6e8cf;scrollbar-width:thin;scrollbar-color:#af936d #f1ddc0}
.table-row{display:grid;width:100%;min-height:61px;align-items:center;gap:12px;padding:0 14px;border:0;border-bottom:1px solid #c6ab865e;background:#f4e6ce;color:#30241b;text-align:left;position:relative;font-size:13px;cursor:pointer}
.table-row:nth-child(even){background:#e9d6b5}
.table-row:hover{background:#f9eacc}
.table-row.selected{background:#f8e4bf;box-shadow:inset 0 0 0 2px #a77c4b}
.table-row.selected:before{content:'';width:3px;background:#ad7843;position:absolute;left:0;top:0;bottom:0}
.c-name{display:flex;align-items:center;gap:14px;min-width:0}
.mini-portrait{height:45px;width:45px;flex:none;border-radius:50%;display:grid;place-items:center;color:#755734;background:linear-gradient(145deg,#f8edd7,#d5b886);border:2px solid #fff7e9;box-shadow:0 1px 3px #5b453b66}
.mini-portrait svg{height:23px;width:23px;stroke:#9b7547;stroke-width:1.6}
.c-name strong{font-size:15px;color:#281d14;font-weight:740;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-name small{color:#765942;font-size:11px;margin-top:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-num{font-size:13px;font-weight:600;color:#4b392b;white-space:nowrap}
.cell-num strong{font-weight:750}
.level-chip{display:inline-flex;align-items:center;border-radius:4px;padding:3px 7px;border:1px solid #c99c58;background:#f5d184;color:#483115;font-size:12px;font-weight:740}
.progress{display:block;width:112px;max-width:100%;height:7px;background:#f8f0de;border:1px solid #af9673;border-radius:2px;overflow:hidden;margin-top:5px}
.progress i{display:block;height:100%;background:linear-gradient(180deg,#aba478,#81784e)}
.status{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;color:#fff5e9;padding:4px 8px;border-radius:999px;background:linear-gradient(#739649,#47722d);border:1px solid #749647;font-weight:650}
.status:before{content:'✓';font-size:10px}
.status.low{background:linear-gradient(#e6c37f,#ca934b);color:#4c2e12;border-color:#cd9c5d}
.status.low:before{content:'!' }
.status.critical,.status.out{background:linear-gradient(#c66b51,#9b4138);border-color:#ad5e4b}
.status.critical:before,.status.out:before{content:'!' }
.status.expiry{background:linear-gradient(#bb955a,#987342);border-color:#a8864e}
.status.expiry:before{content:'◷'}
.status.neutral{background:linear-gradient(#aca49a,#82786f);border-color:#a09886}
.status.neutral:before{content:'•'}
.cell-end{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.more{border:none;background:none;color:#231a11;font-size:23px;padding:3px 7px;line-height:1}
.table-foot{flex:none;min-height:26px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 13px;background:#322e2a;color:#e5c89a;border-top:1px solid #aa8e68;font-size:10px}
.foot-note{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.foot-note:before{content:'ⓘ';margin-right:6px;color:#d6b276}
.empty{padding:45px 20px;text-align:center;color:#806546;font-size:14px}
.grid-stock{grid-template-columns:minmax(200px,2.1fr) minmax(84px,.8fr) minmax(100px,.85fr) minmax(92px,.9fr) minmax(112px,.83fr) 31px}
.grid-alert{grid-template-columns:minmax(220px,2.2fr) minmax(138px,1fr) minmax(100px,.85fr) minmax(126px,1fr) 31px}
.grid-move{grid-template-columns:minmax(220px,2fr) minmax(122px,.9fr) minmax(110px,.85fr) minmax(130px,1fr) minmax(125px,.8fr) 31px}
.grid-receipt{grid-template-columns:minmax(220px,2fr) minmax(160px,1.5fr) minmax(130px,1fr) minmax(130px,.9fr) 31px}
.drawer{position:absolute;z-index:15;top:92px;right:20px;bottom:12px;width:min(430px,44%);border:1px solid #ae854b;border-radius:11px;background:#f3e6d1;overflow:hidden;box-shadow:0 15px 42px #000b,0 0 0 5px #0002;display:flex;flex-direction:column;color:#3c2c1d;transform:translateX(calc(100% + 35px));opacity:0;visibility:hidden;transition:transform .12s ease,opacity .12s ease,visibility .12s ease}
.drawer.open{transform:none;opacity:1;visibility:visible}
.drawer-head{background:linear-gradient(135deg,#463b32,#2c2722);padding:18px 20px 14px;color:#f4e7d1;flex:none}
.drawer-head .kicker{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.13em;color:#dcb684;font-weight:740;margin-bottom:7px}
.drawer-head h2{font:normal 27px/1.12 var(--title);margin:0 25px 12px 0;color:#fef0db}
.drawer-close{position:absolute;right:14px;top:14px;background:#4f4133;border:1px solid #94724e;border-radius:7px;color:#f5e4c9;width:29px;height:29px;font-size:17px}
.drawer-body{min-height:0;overflow:auto;padding:18px 19px;font-size:13px;scrollbar-width:thin;scrollbar-color:#b2916a #e8d8c1}
.drawer-body h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin:18px 0 9px;color:#987448}
.stat-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{border:1px solid #d5bd9d;border-radius:6px;background:#fff8ed;padding:10px 8px}
.stat small{display:block;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#856d51}
.stat strong{display:block;font-size:18px;margin-top:6px;color:#493123}
.data-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 1px;border-bottom:1px solid #d6c4aa;font-size:12px}
.data-line span{color:#82694f}.data-line strong{font-weight:720;text-align:right}
.drawer-actions{border-top:1px solid #ab8c5e;background:#322b24;padding:12px;display:flex;flex-wrap:wrap;gap:9px;flex:none}
.drawer-actions .btn-gold,.drawer-actions .btn-minor{flex:1}
.notice{background:#fff8eb;border:1px solid #dec49c;border-radius:7px;padding:11px 12px;font-size:12px;color:#765434;line-height:1.5;margin-top:12px}
#toast{position:fixed;z-index:90;right:28px;bottom:calc(var(--bottom) + 15px);background:#3a2f24;color:#ffefd2;padding:12px 17px;border-radius:8px;border:1px solid #c99d61;box-shadow:0 10px 23px #0009;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .12s,transform .12s;max-width:440px}
#toast.show{opacity:1;transform:none}
dialog{border:1px solid #ba8c52;border-radius:12px;max-width:min(480px,calc(100vw - 30px));width:440px;padding:0;color:#2b2017;box-shadow:0 22px 80px #000d;background:#f6ecdd}
dialog::backdrop{background:#000b;backdrop-filter:blur(2px)}
.dialog-head{padding:20px 21px 15px;background:#332d26;color:#ffedcf}
.dialog-head h2{font:normal 27px var(--title);margin:0}.dialog-head small{color:#d3b99a}
.dialog-body{padding:17px 20px}.dialog-body label{display:block;margin:12px 0 6px;color:#765a3e;font-size:12px;font-weight:690}
.dialog-body input,.dialog-body select{background:#fffcf5;border:1px solid #cdb293;border-radius:7px;width:100%;padding:9px 10px;color:#3a2719}
.direction{display:flex;gap:8px}.direction button{flex:1;background:#e5d5bd;border:1px solid #c2a17e;border-radius:7px;padding:9px;color:#5c4329;font-size:13px}
.direction button[aria-pressed=true]{background:linear-gradient(#f1d199,#d6a25d);color:#36271b;border-color:#bb8a4f}
.form-error{font-size:12px;color:#953f36;min-height:19px;margin-top:10px}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 19px}
@media(max-width:1500px){
 :root{--side:clamp(225px,18vw,280px)}
 .sidebar-title{font-size:clamp(37px,3.2vw,51px);padding-top:18px;padding-bottom:23px}
 .side-link{font-size:14px;min-height:50px;gap:12px;padding:0 10px}
 .side-link.active{min-height:46px}
 .side-link svg{width:21px;height:21px}
 .sidebar-links{padding-left:12px;padding-right:9px}
 .main{padding:11px 17px 10px}
 .main-header{min-height:48px}
 .heading-text h1{font-size:23px}
 .toolrow{min-height:50px}
 .pill{min-width:86px;height:32px;padding:0 11px;font-size:11px}
 .table-row{min-height:53px;gap:7px;padding:0 9px}
 .table-head{gap:7px;padding:0 10px}
 .c-name{gap:8px}.c-name strong{font-size:12px}.c-name small{font-size:10px}
 .mini-portrait{width:36px;height:36px}.cell-num{font-size:11px}
 .status{font-size:10px}
 .grid-stock{grid-template-columns:minmax(155px,1.8fr) minmax(72px,.65fr) minmax(76px,.65fr) minmax(76px,.7fr) minmax(82px,.7fr) 23px}
 .grid-move{grid-template-columns:minmax(168px,1.6fr) minmax(106px,.85fr) minmax(82px,.7fr) minmax(90px,.9fr) minmax(84px,.7fr) 23px}
 .grid-alert{grid-template-columns:minmax(170px,1.8fr) minmax(115px,1fr) minmax(85px,.7fr) minmax(95px,.9fr) 23px}
 .grid-receipt{grid-template-columns:minmax(168px,1.8fr) minmax(125px,1.3fr) minmax(105px,.8fr) minmax(100px,.7fr) 23px}
}
@media(max-width:1090px){
 .sidebar-title{font-size:35px;letter-spacing:-.08em}
 .side-link{font-size:13px;gap:8px;min-height:46px}
 .side-link.active{min-height:43px}
 .searchbar{width:155px}
 .select-order{display:none}
 .grid-stock{grid-template-columns:minmax(145px,2fr) minmax(72px,.65fr) minmax(68px,.65fr) minmax(75px,.65fr) minmax(85px,.7fr) 20px}
 .cell-num{font-size:10px}
 .table-head{font-size:10px}
 .sidebar-decor{height:40%}
 .drawer{width:52%}
}
@media(max-height:790px){
 .sidebar-title{padding-top:15px;padding-bottom:17px;font-size:clamp(35px,3vw,51px)}
 .side-link{min-height:49px}.side-link.active{min-height:43px}
 .main{padding-top:8px;padding-bottom:8px}
 .main-header{min-height:40px}
 .toolrow{min-height:42px}.pill{height:30px}
 .table-head{min-height:31px}.table-row{min-height:48px}
 .mini-portrait{width:34px;height:34px}
 .c-name strong{font-size:12px}.c-name small{font-size:10px}
 .drawer-body{padding:10px 14px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* V6 · CORRECCIÓN TIPOGRÁFICA Y ALINEACIÓN CON PERSONAL
   La familia general es Inter con Segoe UI de reserva, y el rótulo lateral
   utiliza la misma familia de escritura que los ejemplos de Personal.
   El ajuste de tamaño es específico al nombre, para evitar recortes.
*/
:root{--title:Recoleta,Georgia,serif;--body:Inter,"Segoe UI",Arial,sans-serif}
.sidebar-title{
  font-family:"Segoe Script","Brush Script MT",Z003,cursive;
  font-style:normal;font-weight:400;
  font-size:64px;line-height:1.12;
  letter-spacing:-.045em;
  padding:27px 11px 21px;
  margin:0;
  min-height:116px;
  display:flex;align-items:flex-start;justify-content:center;
  text-align:center;white-space:nowrap;overflow:visible;
  text-shadow:0 1px 1px #5f3b1c,0 0 11px #dbb77b24;
}
.sidebar-title-text{display:inline-block;flex:none;max-width:none;white-space:nowrap}
.sidebar-links{padding-left:28px;padding-right:9px;padding-top:5px}
.side-link{font-family:var(--body);font-size:18px;font-weight:700;letter-spacing:-.02em;gap:15px;padding-left:13px;padding-right:11px}
.side-link.active{margin-bottom:8px}
.side-link svg{width:24px;height:24px}
.side-link .count{font-size:11px}
.heading-text h1{font-family:var(--body);font-weight:730;font-size:30px;letter-spacing:-.04em}
.toolrow{min-height:47px}
.pill{min-width:136px;height:35px;font-family:var(--body);font-size:14px;font-weight:650}
.btn-gold,.btn-minor,.btn-icon{font-family:var(--body)}
.table-head{font-family:var(--body);font-size:13px;font-weight:650}
.table-row{font-family:var(--body);font-size:14px}
.c-name strong{font-family:var(--body);font-size:16px;font-weight:700}
.c-name small{font-family:var(--body);font-size:11px}
.cell-num{font-size:14px}
.status{font-family:var(--body);font-size:12px}
@media (max-width:1500px){
  .sidebar-title{font-size:57px;min-height:110px;padding-top:22px;padding-bottom:20px}
  .sidebar-links{padding-left:20px;padding-right:9px}
  .side-link{font-size:15px;gap:12px}
  .pill{min-width:105px;height:32px;font-size:12px}
  .heading-text h1{font-size:25px}
  .table-head{font-size:11px}.table-row{font-size:12px}.c-name strong{font-size:13px}.cell-num{font-size:12px}.status{font-size:11px}
}
@media (max-width:1090px){
  .sidebar-title{font-size:44px;min-height:91px;padding-top:17px;padding-bottom:12px}
  .sidebar-links{padding-left:12px;padding-right:7px}
  .side-link{font-size:13px;gap:8px;padding-left:9px;padding-right:7px}
  .pill{min-width:84px;height:29px;font-size:11px}
}
@media (max-height:790px){
  .sidebar-title{font-size:54px;min-height:101px;padding-top:17px;padding-bottom:17px}
  .toolrow{min-height:42px}
}
@media (max-width:1090px) and (max-height:790px){.sidebar-title{font-size:42px;min-height:82px;padding-top:12px;padding-bottom:10px}}

/* Bistro Builder · Inventario V7 — escalas funcionales de PC.
   Identidad compartida con Personal; el rediseño afecta sólo al panel Inventario.
   Las dos barras globales son capturas de referencia en esta maqueta y no se reprograman.
*/
:root{
  --side:clamp(244px,17.6vw,340px);
  --top:clamp(52px,4.10vw,82px);
  --bottom:clamp(58px,4.46vw,94px);
}
html,body{min-width:0;min-height:0;max-width:100%;overflow:hidden}
.app{min-width:0;min-height:0;grid-template-columns:var(--side) minmax(0,1fr)}
.sidebar{min-width:0;isolation:isolate}
.sidebar-title{width:100%;padding-left:14px;padding-right:14px;overflow:visible}
.sidebar-title-text{white-space:nowrap;max-width:none;display:inline-block;flex:none}
.sidebar-links{min-width:0}
.side-link{width:100%;min-width:0}
.side-link .count{flex:none}
.main{min-width:0;min-height:0}
.main-header,.heading-text,.action-bar,.toolrow,.pills,.searchbar,.table-frame,.table-rows{min-width:0}
.main-header{flex:none}
.heading-text h1{overflow-wrap:anywhere}
.action-bar{white-space:nowrap}
.toolrow{flex:none}
.pills{scrollbar-width:thin;scrollbar-color:#9c866b transparent}
.searchbar{flex:0 1 260px;min-width:144px}
.select-order{flex:none}
.table-frame{flex:1;min-height:0}
.table-head,.table-row{width:100%;min-width:0}
.table-head span,.table-row>span{min-width:0}
.table-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-num{overflow:hidden;text-overflow:ellipsis}
.c-name{min-width:0}.c-name>span:last-child{min-width:0}
.table-rows{overscroll-behavior:contain}
.drawer{max-height:calc(100% - 110px);min-width:0}
.drawer-body{overscroll-behavior:contain}
#adjustDialog{max-height:min(94dvh,700px);overflow:auto}
@media (min-width:2100px){
  :root{--side:clamp(350px,17vw,408px);--top:clamp(82px,3.9vw,110px);--bottom:clamp(94px,4.30vw,122px)}
  .sidebar-title{min-height:142px;font-size:74px;padding-top:32px}
  .sidebar-links{padding:8px 22px 0 28px}
  .side-link{font-size:19px;min-height:67px;gap:17px}
  .side-link.active{min-height:57px}
  .sidebar-decor{height:min(50%,460px);object-fit:contain;object-position:bottom left}
  .main{padding:28px 35px 20px 28px}
  .heading-text h1{font-size:35px}
  .main-header{min-height:59px}
  .toolrow{min-height:67px}
  .pill{height:39px;font-size:14px;min-width:135px}
  .searchbar input{font-size:13px}
  .table-head{min-height:43px;font-size:14px}
  .table-row{min-height:68px;font-size:15px;gap:15px}
  .c-name strong{font-size:17px}.c-name small{font-size:12px}
  .mini-portrait{height:48px;width:48px}.cell-num{font-size:15px}.status{font-size:12px}
  .drawer{width:min(540px,40%);top:109px;bottom:19px;max-height:calc(100% - 128px)}
  /* En pantallas ultrapanorámicas no se estira la fotografía de las barras. */
  .hud img{object-fit:contain;object-position:center}
}
@media (min-width:1501px) and (max-width:2099px){
  .sidebar-title{font-size:clamp(56px,3.2vw,69px)}
  .main{padding:clamp(16px,1.2vw,23px) clamp(21px,1.5vw,30px) 14px 21px}
}
@media (max-width:1500px){
  :root{--side:clamp(236px,18.2vw,285px)}
  .main{padding:12px 18px 10px 16px}
  .sidebar-links{padding-left:15px;padding-right:11px}
  .sidebar-title{min-height:98px;padding:18px 11px 17px;font-size:55px}
  .side-link{min-height:51px;font-size:15px;gap:12px;padding:0 11px}
  .side-link.active{min-height:46px}
  .heading-text h1{font-size:clamp(23px,1.9vw,29px)}
  .main-header{min-height:48px}
  .toolrow{min-height:52px;gap:8px}
  .pill{min-width:96px;padding:0 12px;font-size:12px;height:34px}
  .searchbar{flex-basis:220px}
  .table-row{min-height:54px;gap:8px;padding:0 10px}
  .table-head{gap:8px;padding:0 10px}
  .mini-portrait{width:37px;height:37px}
  .c-name strong{font-size:13px}.c-name small{font-size:10px}
  .cell-num{font-size:12px}.status{font-size:11px}
  .grid-stock{grid-template-columns:minmax(154px,1.8fr) minmax(74px,.7fr) minmax(78px,.7fr) minmax(77px,.7fr) minmax(88px,.84fr) 24px}
  .grid-move{grid-template-columns:minmax(170px,1.7fr) minmax(99px,.82fr) minmax(85px,.7fr) minmax(90px,.85fr) minmax(83px,.75fr) 24px}
  .grid-alert{grid-template-columns:minmax(170px,1.8fr) minmax(114px,1fr) minmax(85px,.8fr) minmax(95px,.9fr) 24px}
  .grid-receipt{grid-template-columns:minmax(174px,1.9fr) minmax(122px,1.2fr) minmax(105px,.8fr) minmax(105px,.85fr) 24px}
  .drawer{top:89px;right:12px;bottom:10px;max-height:calc(100% - 100px);width:min(440px,48%)}
}
@media (max-width:1320px){
  .toolrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(155px,215px) 115px;gap:8px}
  .pills{width:100%;overflow-x:auto;overflow-y:hidden}
  .pill{min-width:92px;flex:none}
  .searchbar{min-width:0;width:100%;margin:0;flex:none}
  .select-order{width:115px;max-width:115px;display:block}
  .main{padding:10px 15px 9px 13px}
  .sidebar-title{padding-top:14px}
}
@media (max-width:1170px){
  :root{--side:218px}
  .sidebar-title{font-size:47px;min-height:91px;padding:16px 8px 12px}
  .sidebar-links{padding-left:9px;padding-right:8px}
  .side-link{min-height:47px;font-size:13px;gap:10px;padding:0 9px}
  .side-link.active{min-height:44px}
  .side-link svg{height:20px;width:20px}
  .sidebar-decor{height:min(35%,235px);object-fit:contain;object-position:left bottom}
  .main{padding:9px 12px 8px}
  .heading-text h1{font-size:22px}
  .action-bar .btn-gold{min-height:32px;font-size:11px;padding:6px 9px}
  .btn-icon{width:31px;height:31px}
  .toolrow{grid-template-columns:minmax(0,1fr) minmax(125px,190px)}
  .select-order{display:none}
  .pill{height:31px;min-width:75px;padding:0 9px;font-size:11px}
  .grid-stock{grid-template-columns:minmax(135px,1.9fr) minmax(66px,.7fr) minmax(68px,.7fr) minmax(70px,.74fr) minmax(80px,.89fr) 20px}
  .grid-move{grid-template-columns:minmax(144px,1.6fr) minmax(83px,.7fr) minmax(75px,.6fr) minmax(81px,.8fr) minmax(77px,.7fr) 20px}
  .grid-alert{grid-template-columns:minmax(140px,1.7fr) minmax(105px,.9fr) minmax(76px,.7fr) minmax(93px,.9fr) 20px}
  .grid-receipt{grid-template-columns:minmax(144px,1.8fr) minmax(94px,.9fr) minmax(87px,.8fr) minmax(98px,.95fr) 20px}
  .drawer{width:min(430px,57%);top:80px}
  .table-head{font-size:10px}.cell-num{font-size:11px}
}
@media (max-width:980px){
  :root{--side:190px}
  .main-header{align-items:center;gap:5px}
  .heading-text h1{font-size:19px}
  .sidebar-title{font-size:39px;min-height:78px}
  .side-link{font-size:12px;gap:6px}
  .side-link .count{font-size:10px}
  .toolrow{grid-template-columns:minmax(0,1fr);gap:4px;align-content:center}
  .searchbar{width:100%;max-width:none;min-height:27px}
  .pills{height:33px}
  .table-rows{overflow-x:hidden}
  .table-head{display:none}
  .table-row{grid-template-columns:minmax(130px,1fr) 90px !important;grid-template-rows:auto auto auto;row-gap:3px;column-gap:12px;min-height:91px;padding:8px 12px}
  .table-row>span:nth-child(1){grid-column:1;grid-row:1/4}
  .table-row>span:nth-child(2){grid-column:2;grid-row:1}
  .table-row>span:nth-child(3){grid-column:2;grid-row:2}
  .table-row>span:nth-child(4){grid-column:2;grid-row:3}
  .table-row>span:nth-child(5){grid-column:1;grid-row:3;justify-self:start;margin-left:42px}
  .table-row>span:nth-child(6){display:none}
  .table-row.grid-alert>span:nth-child(4),.table-row.grid-receipt>span:nth-child(4){grid-row:3}
  .table-row.grid-move>span:nth-child(5){grid-column:1;grid-row:3;justify-self:start;margin-left:42px}
  .drawer{width:min(450px,75%);top:93px}
}
@media (max-height:780px){
  .sidebar-decor{height:min(42%,265px);object-fit:contain;object-position:left bottom}
  .main{padding-top:8px;padding-bottom:7px}
  .main-header{min-height:38px}
  .toolrow{min-height:42px}
  .table-head{min-height:31px}
  .table-row{min-height:48px}
  .mini-portrait{width:34px;height:34px}
  .table-foot{min-height:23px}
  .drawer{top:76px;bottom:8px;max-height:calc(100% - 84px)}
  .drawer-head{padding:12px 15px}.drawer-body{padding:10px 14px}
  .drawer-actions{padding:8px}
}
@media (max-width:1366px) and (max-height:800px){
  .sidebar-title{min-height:89px;padding-top:13px;padding-bottom:11px}
  .side-link{min-height:44px}.side-link.active{min-height:43px}
  .sidebar-decor{height:min(41%,248px)}
  .toolrow{min-height:41px}
  .pill{height:30px}
}
@media (max-height:670px){
  .sidebar-decor{height:min(31%,175px)}
  .sidebar-title{min-height:74px;padding:10px 8px}
  .side-link{min-height:38px}.side-link.active{min-height:40px}
  .table-row{min-height:44px}
  .drawer{top:68px;bottom:5px;max-height:calc(100% - 73px)}
}
@media(prefers-reduced-motion:reduce){
  .drawer,.table-row,.side-link,.pill,#toast{transition:none!important;animation:none!important}
}
@media (max-width:1170px){.select-order{display:none!important}}

<script>(()=>{
'use strict';
const seed=JSON.parse(document.querySelector('#data-seed').textContent);
const clone=v=>JSON.parse(JSON.stringify(v));
let items=clone(seed.items),moves=clone(seed.movements),receipts=clone(seed.receipts);
let tab='stock',filter='all',search='',sort='priority',chosen='merluza',drawerId=null;
let moveFilter='all',alertFilter='all',receiptFilter='all', adjustment='plus';
let timer=null;
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const es=v=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(v);
const num=(v,u)=>`${es(v)} ${u}`;
const item=id=>items.find(i=>i.id===id);
const avail=i=>Math.max(0,Math.round((i.stock-i.reserved)*1000)/1000);
// Only simulated display classification; Unity must use 2.2C's existing authority.
const status=i=>avail(i)===0?'out':avail(i)<=i.min*.5?'critical':avail(i)<i.min?'low':'normal';
const exp=i=>i.expire>0&&i.days<=3;
const names={out:'Agotado',critical:'Crítico',low:'Stock bajo',normal:'Disponible'};
const severity={out:0,critical:1,low:2,normal:3};
const titleMap={stock:'Existencias del restaurante',alerts:'Alertas de stock',moves:'Movimientos del almacén',receipts:'Recepciones de mercancía'};
const labels={stock:'Existencias',alerts:'Alertas de stock',moves:'Movimientos',receipts:'Recepciones'};
const tinyIcon={
 stock:'<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 10h18m-8-6v16"/>',
 fish:'<path d="M4 12c4-6 10-7 14 0-4 7-10 6-14 0Zm0 0-2-5v10l2-5Z"/><circle cx="14" cy="11" r=".65" fill="currentColor"/>',
 leaf:'<path d="M20 3C10 3 5 8 5 15a5 5 0 0 0 5 5c7 0 10-7 10-17Z"/><path d="M5 20c3-5 7-8 12-11"/>',
 box:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18m-11-7v7"/>',
 alert:'<path d="M11 3a2 2 0 0 1 2 0L22 19H2L11 3Z"/><path d="M12 9v5m0 3h.01"/>',
 truck:'<path d="M2 6h13v12H2zM15 10h4l3 4v4h-7z"/><circle cx="6.5" cy="19" r="2"/><circle cx="18.5" cy="19" r="2"/>',
 move:'<path d="M3 7h17m-5-5 5 5-5 5M21 17H4m5-5-5 5 5 5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
 egg:'<path d="M12 2c-5 0-7 8-7 12a7 7 0 0 0 14 0c0-4-2-12-7-12Z"/>',
 bottle:'<path d="M9 2h6v5l2 3v11H7V10l2-3V2ZM9 5h6M7 12h10"/>'};
const icon=(kind,size=23)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${tinyIcon[kind]||tinyIcon.box}</svg>`;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chip=(str,k)=>`<span class="status ${k}">${escape(str)}</span>`;
const count=()=>({total:items.length,low:items.filter(i=>status(i)==='low').length,critical:items.filter(i=>status(i)==='critical').length,out:items.filter(i=>status(i)==='out').length,expiry:items.filter(exp).length});
function notify(message){let p=$('#toast');p.textContent=message;p.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>p.classList.remove('show'),3600);}
function closeDrawer(){drawerId=null;$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');}
function screen(n){tab=n;filter='all';search='';sort='priority';closeDrawer();render();}
function render(){
 $('#screenTitle').textContent=`${titleMap[tab]}${tab==='stock'?` (${items.length})`:''}`;
 $$('.side-link').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});
 const c=count();$('#alert-count').textContent=c.low+c.critical+c.out+c.expiry;
 $('#primaryAction').textContent=tab==='stock'?'+ Ajustar existencias':'Ver existencias';
 let pills=[];
 if(tab==='stock')pills=[['all','Todos'],['low',`Bajo (${c.low})`],['urgent',`Críticos (${c.critical+c.out})`],['expiry',`Caducidad (${c.expiry})`]];
 else if(tab==='alerts')pills=[['all','Todos'],['low','Stock bajo'],['urgent','Críticos / agotados'],['expiry','Caducidad']];
 else if(tab==='moves')pills=[['all','Todos'],['recepcion','Entradas'],['consumo','Consumos'],['ajuste','Ajustes'],['caducidad','Caducidad']];
 else pills=[['all','Todas'],['Completada','Completadas'],['Con incidencia','Con incidencia']];
 $('#pills').innerHTML=pills.map(([k,l])=>`<button class="pill ${filter===k?'selected':''}" data-filter="${escape(k)}" aria-pressed="${filter===k}">${l}</button>`).join('');
 $('#searchInput').value=search;$('#searchInput').placeholder=tab==='stock'?'Buscar ingrediente...':tab==='alerts'?'Buscar alertas...':tab==='moves'?'Buscar movimientos...':'Buscar recepciones...';
 $('#order').style.display=tab==='stock'?'block':'none';
 $('#order').value=sort;
 if(tab==='stock')renderStock();if(tab==='alerts')renderAlerts();if(tab==='moves')renderMoves();if(tab==='receipts')renderReceipts();
}
function setTable(headers,cols,body,footer){
 $('#cols').className=`table-head ${cols}`;
 $('#cols').innerHTML=headers.map(h=>`<span>${escape(h)}</span>`).join('');
 $('#content').innerHTML=body||'<div class="empty">No hay resultados para estos filtros.</div>';
 $('#tableFoot').textContent=footer;
}
const productIcon=i=>/Pescad|Marisc/.test(i.family)?'fish':/Huevos|lácteos/.test(i.family)?'egg':/Aceites/.test(i.family)?'bottle':/Verduras|Panadería/.test(i.family)?'leaf':'box';
function rowName(iconKey,name,desc){return `<span class="c-name"><span class="mini-portrait">${icon(iconKey)}</span><span><strong>${escape(name)}</strong><small>${escape(desc)}</small></span></span>`;}
function renderStock(){
 let found=items.filter(i=>(filter==='all'||filter==='low'&&status(i)==='low'||filter==='urgent'&&['critical','out'].includes(status(i))||filter==='expiry'&&exp(i))&&i.name.toLocaleLowerCase('es').includes(search.toLocaleLowerCase('es')));
 found.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'es'):sort==='stock'?avail(a)-avail(b):sort==='expiry'?(a.days||999)-(b.days||999):severity[status(a)]-severity[status(b)]||a.name.localeCompare(b.name,'es'));
 let rows=found.map(i=>{
 const st=status(i);
 return `<button type="button" data-item="${i.id}" class="table-row grid-stock ${chosen===i.id?'selected':''}" aria-label="Ficha de ${escape(i.name)}, ${num(avail(i),i.unit)} disponibles">${rowName(productIcon(i),i.name,i.family)}<span class="cell-num"><strong>${num(i.stock,i.unit)}</strong></span><span class="cell-num">${num(i.reserved,i.unit)}</span><span class="cell-num"><strong>${num(avail(i),i.unit)}</strong></span><span>${chip(names[st],st)}</span><span class="cell-end"><span class="more">•••</span></span></button>`}).join('');
 setTable(['Ingrediente','Stock total','Reservado','Disponible','Estado',''], 'grid-stock', rows,`${found.length} de ${items.length} ingredientes · FEFO y lotes automáticos · Datos de demostración`);
}
function alerts(){return items.flatMap(i=>{
 const s=status(i),r=[];
 if(s!=='normal')r.push({id:`${i.id}:stock`,item:i.id,type:s,title:i.name,desc:s==='out'?'Sin unidades disponibles':s==='critical'?'Disponibilidad crítica':'Por debajo del mínimo'});
 if(exp(i))r.push({id:`${i.id}:expiry`,item:i.id,type:'expiry',title:i.name,desc:`${num(i.expire,i.unit)} caducan en ${i.days} ${i.days===1?'día':'días'}`});
 return r;});}
function renderAlerts(){
 let list=alerts().filter(a=>(filter==='all'||filter==='low'&&a.type==='low'||filter==='urgent'&&['critical','out'].includes(a.type)||filter==='expiry'&&a.type==='expiry')&&a.title.toLowerCase().includes(search.toLowerCase()));
 list.sort((a,b)=>(a.type==='expiry'?3:severity[a.type])-(b.type==='expiry'?3:severity[b.type]));
 const rows=list.map(a=>{
 const i=item(a.item),s=a.type==='expiry'?'Caducidad':names[a.type];return `<button class="table-row grid-alert" data-alert="${escape(a.id)}">${rowName(a.type==='expiry'?'clock':'alert',a.title,a.desc)}<span class="cell-num">${chip(s,a.type)}</span><span class="cell-num">${num(avail(i),i.unit)}</span><span class="cell-num">${num(i.forecast,i.unit)} previstos</span><span class="cell-end"><span class="more">•••</span></span></button>`;
 }).join('');
 setTable(['Ingrediente','Aviso','Disponible','Próximo servicio',''],'grid-alert',rows,`${list.length} avisos visibles · Alertas simuladas a partir de los datos de ejemplo`);
}
function moveTitle(m){return ({recepcion:'Recepción de mercancía',consumo:'Consumo de cocina',ajuste:'Ajuste manual',caducidad:'Caducidad'})[m.kind]||m.cause;}
function renderMoves(){
 const list=moves.filter(m=>(filter==='all'||m.kind===filter)&&`${item(m.item)?.name} ${m.cause} ${m.ref}`.toLowerCase().includes(search.toLowerCase()));
 const rows=list.map(m=>{const i=item(m.item);return `<button class="table-row grid-move" data-move="${m.id}">${rowName(m.qty>=0?'truck':'move',i?.name||'Ingrediente',moveTitle(m))}<span class="cell-num">${escape(m.when)}</span><span class="cell-num"><strong style="color:${m.qty>=0?'#557435':'#a75c42'}">${m.qty>=0?'+':'−'}${num(Math.abs(m.qty),i?.unit||'')}</strong></span><span class="cell-num">${escape(m.cause)}</span><span class="cell-num">${escape(m.ref)}</span><span class="cell-end"><span class="more">•••</span></span></button>`}).join('');
 setTable(['Producto / operación','Momento','Variación','Concepto','Referencia',''],'grid-move',rows,`${list.length} movimientos · Registros informativos; no editables`);
}
function renderReceipts(){
 const list=receipts.filter(r=>(filter==='all'||r.state===filter)&&`${r.provider} ${r.id} ${r.when}`.toLowerCase().includes(search.toLowerCase()));
 const rows=list.map(r=>`<button class="table-row grid-receipt" data-receipt="${r.id}">${rowName('truck',r.id,r.provider)}<span class="cell-num">${escape(r.when)}</span><span class="cell-num">${r.lines.length} referencias</span><span>${chip(r.state,r.state==='Completada'?'normal':'low')}</span><span class="cell-end"><span class="more">•••</span></span></button>`).join('');
 setTable(['Recepción / proveedor','Fecha','Mercancía','Resultado',''],'grid-receipt',rows,`${list.length} recepciones · Lotes y logística gestionados automáticamente`);
}
function detail(type,id){
 drawerId={type,id};
 const head=$('#drawerHead'),body=$('#drawerBody'),actions=$('#drawerActions');
 if(type==='stock'||type==='alert'){
  const key=type==='alert'?id.split(':')[0]:id;const i=item(key);if(!i)return;
  chosen=key;const st=status(i);
  head.innerHTML=`<span class="kicker">Ficha del ingrediente · ${escape(i.family)}</span><h2>${escape(i.name)}</h2>${chip(names[st],st)} ${exp(i)?chip('Próxima caducidad','expiry'):''}`;
  body.innerHTML=`<div class="stat-strip"><div class="stat"><small>Stock</small><strong>${num(i.stock,i.unit)}</strong></div><div class="stat"><small>Disponible</small><strong>${num(avail(i),i.unit)}</strong></div><div class="stat"><small>Reservado</small><strong>${num(i.reserved,i.unit)}</strong></div></div><h3>Control del almacén</h3>${dataLine('Stock mínimo',num(i.min,i.unit))}${dataLine('Previsión próxima',num(i.forecast,i.unit))}${dataLine('Próximo a caducar',num(i.expire,i.unit))}${dataLine('Última recepción',i.last)}${dataLine('Proveedor habitual',i.provider)}<p class="notice">La rotación FEFO es automática. Esta ficha no permite manipular lotes ni precios.</p>`;
  actions.innerHTML=`<button class="btn-gold" data-action="adjust" data-id="${i.id}">Ajustar existencias</button><button class="btn-minor" data-action="item-moves" data-id="${i.id}">Ver movimientos</button>`;
 }else if(type==='move'){
  const m=moves.find(m=>m.id===id);if(!m)return;const i=item(m.item);
  head.innerHTML=`<span class="kicker">Libro de movimientos · ${m.id}</span><h2>${escape(moveTitle(m))}</h2>${chip(m.qty>=0?'Entrada':'Salida',m.qty>=0?'normal':'neutral')}`;
  body.innerHTML=`<div class="stat-strip"><div class="stat"><small>Variación</small><strong>${m.qty>=0?'+':'−'}${num(Math.abs(m.qty),i.unit)}</strong></div><div class="stat"><small>Momento</small><strong style="font-size:14px">${escape(m.when)}</strong></div><div class="stat"><small>Producto</small><strong style="font-size:13px">${escape(i.name)}</strong></div></div><h3>Trazabilidad</h3>${dataLine('Concepto',m.cause)}${dataLine('Referencia',m.ref)}${dataLine('Identificador',m.id)}<p class="notice">Los movimientos históricos son registros informativos y no se modifican.</p>`;
  actions.innerHTML=`<button class="btn-gold" data-action="go-item" data-id="${i.id}">Ver ingrediente</button>`;
 }else if(type==='receipt'){
  const r=receipts.find(r=>r.id===id);if(!r)return;
  head.innerHTML=`<span class="kicker">Entrada de mercancía · ${r.id}</span><h2>${escape(r.provider)}</h2>${chip(r.state,r.state==='Completada'?'normal':'low')}`;
  body.innerHTML=`${dataLine('Fecha',r.when)}${dataLine('Referencia',r.id)}<h3>Mercancía recibida</h3>${r.lines.map(l=>dataLine(l[0],l[1])).join('')}<p class="notice">${escape(r.notes)}</p>`;
  actions.innerHTML=`<button class="btn-gold" data-action="receipt-moves" data-id="${r.id}">Ver movimientos</button>`;
 }
 $('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');
}
function dataLine(k,v){return `<div class="data-line"><span>${escape(k)}</span><strong>${escape(v)}</strong></div>`}
function openAdjustment(id){
 const i=item(id||chosen);if(!i)return;
 chosen=i.id;adjustment='plus';$('#btnPlus').setAttribute('aria-pressed','true');$('#btnMinus').setAttribute('aria-pressed','false');
 $('#adjustTarget').textContent=`${i.name} · ${num(i.stock,i.unit)} en stock · ${num(i.reserved,i.unit)} reservados`;
 $('#adjustAmount').value='';$('#adjustReason').value='Corrección de inventario';$('#formError').textContent='';
 $('#adjustDialog').showModal();$('#adjustAmount').focus();
}
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;screen(b.dataset.tab)});
$('#pills').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;closeDrawer();render();});
$('#searchInput').addEventListener('input',e=>{search=e.target.value;closeDrawer();render();$('#searchInput').focus();});
$('#order').addEventListener('change',e=>{sort=e.target.value;closeDrawer();render()});
$('#content').addEventListener('click',e=>{
 const b=e.target.closest('[data-item],[data-alert],[data-move],[data-receipt]');if(!b)return;
 if(b.dataset.item)detail('stock',b.dataset.item);
 else if(b.dataset.alert)detail('alert',b.dataset.alert);
 else if(b.dataset.move)detail('move',b.dataset.move);
 else if(b.dataset.receipt)detail('receipt',b.dataset.receipt);
});
$('#drawerActions').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 switch(b.dataset.action){
  case 'adjust':openAdjustment(b.dataset.id);break;
  case 'go-item':screen('stock');detail('stock',b.dataset.id);break;
  case 'item-moves':screen('moves');{const m=moves.find(m=>m.item===b.dataset.id);if(m)detail('move',m.id)}break;
  case 'receipt-moves':screen('moves');{const m=moves.find(m=>m.ref===b.dataset.id);if(m)detail('move',m.id)}break;
 }
});
$('#drawerClose').addEventListener('click',closeDrawer);
$('#primaryAction').addEventListener('click',()=>tab==='stock'?openAdjustment(chosen):screen('stock'));
$('#resetDemo').addEventListener('click',()=>{items=clone(seed.items);moves=clone(seed.movements);receipts=clone(seed.receipts);chosen='merluza';screen('stock');notify('Simulación restablecida.')});
$$('.hud-hotspot').forEach(b=>b.addEventListener('click',()=>notify('Barra global reproducida visualmente para comparación. No navega a Unity.')));
$('#btnPlus').addEventListener('click',()=>{adjustment='plus';$('#btnPlus').setAttribute('aria-pressed','true');$('#btnMinus').setAttribute('aria-pressed','false')});
$('#btnMinus').addEventListener('click',()=>{adjustment='minus';$('#btnMinus').setAttribute('aria-pressed','true');$('#btnPlus').setAttribute('aria-pressed','false')});
$('#cancelAdjust').addEventListener('click',()=>$('#adjustDialog').close());
$('#adjustForm').addEventListener('submit',e=>{
 e.preventDefault();const q=Number($('#adjustAmount').value),i=item(chosen),el=$('#formError');
 if(!Number.isFinite(q)||q<=0){el.textContent='Introduce una cantidad mayor que cero.';return;}
 if(adjustment==='minus'&&q>avail(i)){el.textContent=`No puedes reducir más de ${num(avail(i),i.unit)}: se conserva el stock reservado.`;return;}
 const diff=adjustment==='plus'?q:-q;i.stock=Math.round((i.stock+diff)*1000)/1000;i.expire=Math.min(i.expire,i.stock);
 const id='M-DEMO-'+(moves.filter(m=>m.id.startsWith('M-DEMO-')).length+1);
 moves.unshift({id,kind:'ajuste',item:i.id,qty:diff,when:'Hoy · 12:00',cause:$('#adjustReason').value,ref:'Ajuste manual simulado'});
 $('#adjustDialog').close();closeDrawer();render();notify(`${i.name}: ${diff>=0?'+':'−'}${num(Math.abs(diff),i.unit)}. Se ha creado el movimiento ${id}.`);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#adjustDialog').open)closeDrawer()});
render();
window.BistroInventoryDemo={getState:()=>({items:clone(items),movements:clone(moves),tab,summary:count()}),selectTab:screen,reset:()=>$('#resetDemo').click()};
})();
</script>
<script id="title-fit-controller">
/* Ajusta solo el rótulo lateral; no escala navegación, tablas ni botones. */
(function(){
  const parent=document.querySelector('.sidebar-title');
  const label=document.querySelector('.sidebar-title-text');
  if(!parent||!label) return;
  const fit=()=>{
    const css=getComputedStyle(parent), base=parseFloat(css.fontSize)||60;
    const available=Math.max(140,parent.clientWidth-28);
    label.style.fontSize=base+'px';
    label.style.letterSpacing=css.letterSpacing;
    const natural=label.getBoundingClientRect().width;
    const scale=Math.min(1,available/Math.max(natural,1));
    label.style.fontSize=Math.max(30,base*scale*.98)+'px';
  };
  fit();
  document.fonts?.ready?.then(fit);
  window.addEventListener('resize',fit,{passive:true});
})();
</script>
