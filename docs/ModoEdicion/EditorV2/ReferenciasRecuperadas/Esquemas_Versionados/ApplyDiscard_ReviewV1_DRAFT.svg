<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 610" width="1220" height="610">
<rect x="0" y="0" width="1220" height="610" rx="0" fill="#f7f0e5" stroke="#ead8ba" stroke-width="2"/>
<text x="24" y="42" fill="#3e2a16" font-size="28" font-family="Arial,sans-serif" font-weight="bold">BISTRO BUILDER · EDITOR V2 · APLICAR / DESCARTAR</text>
<text x="24" y="69" fill="#7b5b39" font-size="15" font-family="Arial,sans-serif" font-weight="normal">Esquema V1 — propuesta no aprobada · interfaces de confirmación global y protección al salir</text>
<rect x="18" y="84" width="1184" height="476" rx="14" fill="#e7d0ae" stroke="#a16e31" stroke-width="2"/>
<rect x="32" y="122" width="372" height="385" rx="14" fill="#f7e7d1" stroke="#a7783e" stroke-width="2"/><text x="52" y="153" fill="#8c6c44" font-size="12" font-family="Arial,sans-serif" font-weight="bold">EDITOR V2 · REFORMA</text><text x="52" y="188" fill="#3b2615" font-size="21" font-family="Arial,sans-serif" font-weight="bold">Revisar antes de aplicar</text><text x="52" y="211" fill="#4a331d" font-size="11" font-family="Arial,sans-serif" font-weight="normal">Resumen, coste neto y diagnóstico.</text><rect x="52" y="235" width="332" height="73" rx="10" fill="#fff6e9" stroke="#bc9460" stroke-width="2"/><text x="67" y="253" fill="#573e26" font-size="13" font-family="Arial,sans-serif" font-weight="bold">12 cambios       8.320 €       117.130 €</text><text x="67" y="282" fill="#4a331d" font-size="12" font-family="Arial,sans-serif" font-weight="normal">Mobiliario 7  ·  Construcción 3  ·  Superficies 2</text><rect x="52" y="322" width="332" height="95" rx="10" fill="#f5e8ce" stroke="#bc9460" stroke-width="2"/><text x="64" y="346" fill="#4a331d" font-size="12" font-family="Arial,sans-serif" font-weight="normal">Validación: sin incidencias confirmadas</text><text x="64" y="374" fill="#4a331d" font-size="12" font-family="Arial,sans-serif" font-weight="normal">No hay publicación sin confirmar.</text><rect x="52" y="452" width="153" height="35" rx="10" fill="#fff8eb" stroke="#bc9460" stroke-width="2"/><text x="65" y="475" fill="#412b16" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Seguir editando</text><rect x="214" y="452" width="170" height="35" rx="10" fill="#e4b36c" stroke="#bc9460" stroke-width="2"/><text x="227" y="475" fill="#412b16" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Aplicar reforma</text>
<rect x="424" y="122" width="372" height="385" rx="14" fill="#f7e7d1" stroke="#a7783e" stroke-width="2"/><text x="444" y="153" fill="#8c6c44" font-size="12" font-family="Arial,sans-serif" font-weight="bold">EDITOR V2 · REFORMA</text><text x="444" y="188" fill="#3b2615" font-size="21" font-family="Arial,sans-serif" font-weight="bold">¿Descartar toda la reforma?</text><text x="444" y="211" fill="#4a331d" font-size="11" font-family="Arial,sans-serif" font-weight="normal">Confirmación explícita; rojo destructivo.</text><rect x="444" y="238" width="332" height="143" rx="10" fill="#fff4e8" stroke="#bc9460" stroke-width="2"/><text x="456" y="264" fill="#4a331d" font-size="13" font-family="Arial,sans-serif" font-weight="normal">Se pierden los cambios no aplicados:</text><text x="456" y="293" fill="#4a331d" font-size="13" font-family="Arial,sans-serif" font-weight="normal">• Mobiliario y construcción</text><text x="456" y="320" fill="#4a331d" font-size="13" font-family="Arial,sans-serif" font-weight="normal">• Superficies y costes de reforma</text><text x="456" y="348" fill="#4a331d" font-size="13" font-family="Arial,sans-serif" font-weight="normal">• Retorno exacto a la baseline</text><rect x="444" y="452" width="141" height="35" rx="10" fill="#fff8eb" stroke="#bc9460" stroke-width="2"/><text x="457" y="475" fill="#412b16" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Cancelar</text><rect x="592" y="452" width="184" height="35" rx="10" fill="#ac423a" stroke="#bc9460" stroke-width="2"/><text x="605" y="475" fill="#fff8ee" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Sí, descartar reforma</text>
<rect x="816" y="122" width="372" height="385" rx="14" fill="#f7e7d1" stroke="#a7783e" stroke-width="2"/><text x="836" y="153" fill="#8c6c44" font-size="12" font-family="Arial,sans-serif" font-weight="bold">EDITOR V2 · REFORMA</text><text x="836" y="188" fill="#3b2615" font-size="21" font-family="Arial,sans-serif" font-weight="bold">Hay una reforma pendiente</text><text x="836" y="211" fill="#4a331d" font-size="11" font-family="Arial,sans-serif" font-weight="normal">Salir solo tras resolver los cambios.</text><rect x="836" y="239" width="332" height="140" rx="10" fill="#fff4e8" stroke="#bc9460" stroke-width="2"/><text x="848" y="266" fill="#4a331d" font-size="13" font-family="Arial,sans-serif" font-weight="normal">¿Qué hacer con los 12 cambios pendientes?</text><text x="848" y="298" fill="#4a331d" font-size="12" font-family="Arial,sans-serif" font-weight="normal">No salir silenciosamente ni perder datos.</text><rect x="836" y="421" width="136" height="35" rx="10" fill="#fff8eb" stroke="#bc9460" stroke-width="2"/><text x="849" y="444" fill="#412b16" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Seguir editando</text><rect x="979" y="421" width="189" height="35" rx="10" fill="#e4b36c" stroke="#bc9460" stroke-width="2"/><text x="992" y="444" fill="#412b16" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Revisar para aplicar</text><rect x="979" y="463" width="189" height="35" rx="10" fill="#ac423a" stroke="#bc9460" stroke-width="2"/><text x="992" y="486" fill="#fff8ee" font-size="13" font-family="Arial,sans-serif" font-weight="bold">Descartar…</text>
<text x="24" y="587" fill="#745334" font-size="13" font-family="Arial,sans-serif" font-weight="normal">Datos ilustrativos. El motor B5 y Finanzas, no la UI, autorizan la operación real. Sin código Unity.</text>
</svg>